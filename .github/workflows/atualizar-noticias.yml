name: Atualizar notícias e agenda STAO

on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - update_agenda.py
      - update_news.py
      - test_update_news.py
      - agenda_estadual.json
      - .github/workflows/atualizar-noticias.yml
  workflow_dispatch:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stao-atualizacao
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperar a última coleta publicada
        run: |
          python - <<'PYTHON'
          import json
          import urllib.request
          from pathlib import Path
          for name in ('news.json', 'agenda.json'):
              try:
                  request = urllib.request.Request(
                      'https://amaurioliveiraandira.github.io/Stao-TV/' + name,
                      headers={'Cache-Control': 'no-cache', 'User-Agent': 'STAO-TV/1.0'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      data = json.load(response)
                  if not isinstance(data, dict) or not isinstance(data.get('items'), list):
                      raise ValueError('Formato inválido')
                  Path(name).write_text(json.dumps(data, ensure_ascii=False), encoding='utf-8')
                  print('Coleta anterior recuperada:', name)
              except Exception as error:
                  print('Usando arquivo do repositório:', name, str(error))
          PYTHON

      - name: Atualizar notícias
        run: python update_news.py

      - name: Testar coleta da agenda
        run: python -m unittest test_update_agenda.py test_update_news.py

      - name: Atualizar agenda fiscal
        id: agenda
        continue-on-error: true
        run: python update_agenda.py

      - name: Preparar arquivos públicos
        run: |
          mkdir -p public
          cp index.html news.json agenda.json public/
          cp -R assets public/assets

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar painel
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publicar:
    needs: atualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar painel no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
